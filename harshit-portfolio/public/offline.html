<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F40C3F" />
    <title>Offline — Harshit Chauhan</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100dvh;
        background: #F40C3F;
        color: #160000;
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      main { text-align: center; padding: 1.5rem; }
      h1 { font-size: 1.5rem; letter-spacing: -0.04em; text-transform: uppercase; }
      p { max-width: 22rem; line-height: 1.4; font-weight: 600; }
      a { color: inherit; font-weight: 800; }
    </style>
  </head>
  <body>
    <main>
      <h1>Harshit Chauhan</h1>
      <p>You’re offline, and this device hasn’t finished saving the site yet. Reconnect and reload once — after that it runs without a connection.</p>
      <p><a href="/">Retry</a></p>
    </main>
  </body>
</html>
