name: build
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: harshit-portfolio/package-lock.json
      - run: npm ci
        working-directory: harshit-portfolio
      - run: npm run build
        working-directory: .
