version: 2
updates:
  - package-ecosystem: npm
    directory: /harshit-portfolio
    schedule:
      interval: weekly
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      tooling:
        patterns: ["eslint*", "@eslint/*", "typescript*", "prettier*", "@playwright/*", "@axe-core/*", "globals"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
